<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>수원 문화 프로그램 지도</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #app {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    #sidebar {
      width: 320px;
      flex: none;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #fff;
    }

    #controls {
      padding: 10px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid #eee;
    }

    #controls input,
    #controls select {
      padding: 6px;
    }

    #list {
      flex: 1;
      overflow-y: auto;
    }

    .event-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .event-item:hover {
      background: #f7f7f7;
    }

    .event-item .date {
      font-size: 0.78rem;
      color: #888;
    }

    .event-item .title {
      font-size: 0.9rem;
      margin-top: 2px;
    }

    #map {
      flex: 1;
    }

    #authBar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #222;
      color: #fff;
      font-size: 0.85rem;
    }

    #authStatus {
      flex: 1;
    }

    .login-btn {
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
    }

    .login-btn.kakao {
      background: #FEE500;
      color: #000;
    }

    .login-btn.google {
      background: #fff;
      color: #000;
    }

    .login-btn.naver {
      background: #03C75A;
      color: #fff;
    }

    .login-btn.logout {
      background: #555;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- 로그인 바 -->
  <div id="authBar">
    <span id="authStatus">로그인 확인 중...</span>
    <a id="kakaoLoginBtn" class="login-btn kakao"
      href="https://kauth.kakao.com/oauth/authorize?client_id=e9da4327b7be240f13ddd639379fe1fc&redirect_uri=http://localhost:8080/api/auth/kakao/callback&response_type=code">카카오
      로그인</a>
    <a id="googleLoginBtn" class="login-btn google"
      href="https://accounts.google.com/o/oauth2/v2/auth?client_id=440681864198-k826a7epdj47stfnp7omhufp6rm7dbg7.apps.googleusercontent.com&redirect_uri=http://localhost:8080/api/auth/google/callback&response_type=code&scope=email%20profile">구글
      로그인</a>
    <a id="naverLoginBtn" class="login-btn naver"
      href="https://nid.naver.com/oauth2.0/authorize?response_type=code&client_id=Q7X7EYInh1P5DiiyuSy0&redirect_uri=http://localhost:8080/api/auth/naver/callback&state=test123">네이버
      로그인</a>
    <button id="logoutBtn" class="login-btn logout" style="display:none;">로그아웃</button>
  </div>
  <!--  -->
  <div id="app">
    <aside id="sidebar">
      <div id="controls">
        <input type="text" id="searchInput" placeholder="행사 이름 검색">
        <select id="categorySelect">
          <option value="all">전체 카테고리</option>
        </select>
      </div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7e3b2a42df77bc183241db2bcc6c3cbb&autoload=false"></script>
  <script>
    var map;
    var markerList = [];
    var currentInfowindow = null;

    kakao.maps.load(function () {
      var mapContainer = document.getElementById('map');
      var mapOption = {
        center: new kakao.maps.LatLng(37.2636, 127.0286),
        level: 6
      };
      map = new kakao.maps.Map(mapContainer, mapOption);

      function checkAuth() {
        fetch('/api/auth/me')
          .then(r => r.json())
          .then(data => {
            var status = document.getElementById('authStatus');
            var kakaoBtn = document.getElementById('kakaoLoginBtn');
            var googleBtn = document.getElementById('googleLoginBtn');
            var naverBtn = document.getElementById('naverLoginBtn');
            var logoutBtn = document.getElementById('logoutBtn');

            if (data.loggedIn) {
              status.textContent = '로그인됨 (회원 번호: ' + data.memberId + ')';
              kakaoBtn.style.display = 'none';
              googleBtn.style.display = 'none';
              naverBtn.style.display = 'none';
              logoutBtn.style.display = 'inline-block';
            } else {
              status.textContent = '로그인 안 됨';
              kakaoBtn.style.display = 'inline-block';
              googleBtn.style.display = 'inline-block';
              naverBtn.style.display = 'inline-block';
              logoutBtn.style.display = 'none';
            }
          });
      }

      document.getElementById('logoutBtn').addEventListener('click', function () {
        fetch('/api/auth/logout', { method: 'POST' }).then(function () {
          checkAuth();
        });
      });

      checkAuth();

      fetch('/api/events')
        .then(response => response.json())
        .then(events => {
          setupCategoryOptions(events);

          events.forEach(function (event) {
            var markerPosition = new kakao.maps.LatLng(event.latitude, event.longitude);
            var marker = new kakao.maps.Marker({ position: markerPosition });
            marker.setMap(map);

            var infowindow = new kakao.maps.InfoWindow({
              content: '<div style="padding:5px;">' + event.title + '</div>'
            });

            kakao.maps.event.addListener(marker, 'click', function () {
              toggleInfowindow(infowindow, marker);
            });

            markerList.push({ marker: marker, event: event, infowindow: infowindow });
          });

          filterMarkers();
        });
    });

    function toggleInfowindow(infowindow, marker) {
      if (currentInfowindow === infowindow) {
        infowindow.close();
        currentInfowindow = null;
        return;
      }
      if (currentInfowindow) {
        currentInfowindow.close();
      }
      infowindow.open(map, marker);
      currentInfowindow = infowindow;
    }

    function setupCategoryOptions(events) {
      var categories = [...new Set(events.map(e => e.category))];
      var select = document.getElementById('categorySelect');
      categories.forEach(function (category) {
        var option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });
    }

    function filterMarkers() {
      var keyword = document.getElementById('searchInput').value.trim();
      var selectedCategory = document.getElementById('categorySelect').value;

      if (currentInfowindow) {
        currentInfowindow.close();
        currentInfowindow = null;
      }

      var visibleItems = [];

      markerList.forEach(function (item) {
        var matchesKeyword = item.event.title.includes(keyword);
        var matchesCategory = (selectedCategory === 'all') || (item.event.category === selectedCategory);
        var visible = matchesKeyword && matchesCategory;

        item.marker.setMap(visible ? map : null);

        if (visible) {
          visibleItems.push(item);
        }
      });

      renderSidebar(visibleItems);
    }

    function renderSidebar(items) {
      var sorted = items.slice().sort(function (a, b) {
        var da = a.event.startDate;
        var db = b.event.startDate;
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return da.localeCompare(db);
      });

      var list = document.getElementById('list');
      list.innerHTML = '';

      sorted.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'event-item';

        var dateText = item.event.startDate
          ? item.event.startDate + (item.event.endDate && item.event.endDate !== item.event.startDate ? ' ~ ' + item.event.endDate : '')
          : '기간 정보 없음';

        div.innerHTML = '<div class="date">' + dateText + '</div><div class="title">' + item.event.title + '</div>';

        div.addEventListener('click', function () {
          map.setCenter(item.marker.getPosition());
          map.setLevel(5);
          toggleInfowindow(item.infowindow, item.marker);
        });

        list.appendChild(div);
      });
    }

    document.getElementById('searchInput').addEventListener('input', filterMarkers);
    document.getElementById('categorySelect').addEventListener('change', filterMarkers);
  </script>
</body>

</html>
